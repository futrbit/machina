<!-- ARTICLE READER -->

<div id="reader" class="archive-reader">

  <div class="reader-top">
    <span class="archive-brand">MACHINA / READER</span>

    <button id="closeReader" class="reader-close">

<script>

const root = document.getElementById("root");
const search = document.getElementById("search");
const category = document.getElementById("category");
const count = document.getElementById("count");

const reader = document.getElementById("reader");
const readerBody = document.getElementById("readerBody");
const closeReader = document.getElementById("closeReader");

let all = [];


/* ---------------------------------------------------------
   SECURITY
--------------------------------------------------------- */

function escapeHTML(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* ---------------------------------------------------------
   DATE
--------------------------------------------------------- */

function dateParts(dateString) {

  const date = new Date(dateString);

  if (Number.isNaN(date.getTime())) {
    return {
      day: "--",
      month: "UNKNOWN",
      year: ""
    };
  }

  return {
    day: String(date.getUTCDate()).padStart(2, "0"),
    month: date.toLocaleDateString("en-GB", {
      month: "short",
      timeZone: "UTC"
    }).toUpperCase(),
    year: date.getUTCFullYear()
  };
}


/* ---------------------------------------------------------
   THUMBNAIL
--------------------------------------------------------- */

function thumbnail(article) {

  return article.thumbnail ||
         article.image ||
         "/frontend/thumb-tech.jpg";

}


/* ---------------------------------------------------------
   GROUP BY DAY
--------------------------------------------------------- */

function groupByDay(list) {

  const groups = {};

  list.forEach(article => {

    const raw = article.sort_dt ||
                article.published ||
                "";

    const date = new Date(raw);

    let key;

    if (Number.isNaN(date.getTime())) {
      key = "unknown";
    } else {
      key = date.toISOString().slice(0, 10);
    }

    if (!groups[key]) {
      groups[key] = [];
    }

    groups[key].push(article);

  });

  return groups;

}


/* ---------------------------------------------------------
   RENDER ARCHIVE
--------------------------------------------------------- */

function renderList(list) {

  root.innerHTML = "";

  count.textContent =
    `${list.length} ${list.length === 1 ? "story" : "stories"}`;


  if (!list.length) {

    root.innerHTML = `
      <div class="archive-empty">
        No stories found.
      </div>
    `;

    return;

  }


  const groups = groupByDay(list);

  Object.keys(groups)
    .sort()
    .reverse()
    .forEach(day => {

      const articles = groups[day];

      const section = document.createElement("section");
      section.className = "archive-day";


      let date;

      if (day === "unknown") {

        date = {
          day: "--",
          month: "UNKNOWN",
          year: ""
        };

      } else {

        date = dateParts(day);

      }


      section.innerHTML = `

        <div class="archive-date">

          <div class="archive-date-day">
            ${escapeHTML(date.day)}
          </div>

          <div class="archive-date-month">
            ${escapeHTML(date.month)}
            ${escapeHTML(String(date.year))}
          </div>

        </div>

        <div class="archive-items"></div>

      `;


      const items =
        section.querySelector(".archive-items");


      articles.forEach(article => {

        const item =
          document.createElement("article");

        item.className = "archive-item";

        item.dataset.id = article.id;


        item.innerHTML = `

          <img
            class="archive-thumb"
            src="${escapeHTML(thumbnail(article))}"
            alt=""
            loading="lazy"
            onerror="this.src='/frontend/thumb-tech.jpg'"
          >

          <div>

            <div class="archive-category">
              ${escapeHTML(article.category || "technology")}
            </div>

            <h2 class="archive-item-title">
              ${escapeHTML(article.title)}
            </h2>

            <div class="archive-meta">
              ${(article.authors || []).map(escapeHTML).join(", ")}
              ${article.published ? " Â· " + escapeHTML(article.published) : ""}
            </div>

          </div>

          <div class="archive-arrow">
            â†’
          </div>

        `;


        item.addEventListener("click", () => {

          showArticle(article.id);

        });


        items.appendChild(item);

      });


      root.appendChild(section);

    });

}


/* ---------------------------------------------------------
   ARTICLE READER
--------------------------------------------------------- */

async function showArticle(id) {

  reader.classList.add("open");

  document.body.style.overflow = "hidden";

  readerBody.innerHTML = `
    <div class="archive-loading">
      Loading storyâ€¦
    </div>
  `;


  try {

    const response =
      await fetch(`/article/${encodeURIComponent(id)}`);

    if (!response.ok) {
      throw new Error("Article not found");
    }


    const article =
      await response.json();


    let text =
      article.text ||
      article.content ||
      "No content available.";


    text =
      text.replace(/^Rewritten:\s*/i, "");


    const paragraphs =
      text
        .split(/\n\s*\n/)
        .map(p => p.trim())
        .filter(Boolean);


    readerBody.innerHTML = `

      <div class="reader-category">
        ${escapeHTML(article.category || "technology")}
      </div>

      <h1 class="reader-title">
        ${escapeHTML(article.title)}
      </h1>

      <div class="reader-meta">
        ${(article.authors || []).map(escapeHTML).join(", ")}
        ${article.published ? " Â· " + escapeHTML(article.published) : ""}
      </div>

      ${
        article.thumbnail || article.image
        ? `
          <img
            class="reader-image"
            src="${escapeHTML(article.thumbnail || article.image)}"
            alt=""
          >
        `
        : ""
      }

      <div class="reader-text">

        ${
          paragraphs.length
          ? paragraphs.map(p =>
              `<p>${escapeHTML(p)}</p>`
            ).join("")
          : `<p>${escapeHTML(text)}</p>`
        }

      </div>

      ${
        article.url
        ? `
          <div class="reader-source">
            <a
              href="${escapeHTML(article.url)}"
              target="_blank"
              rel="noopener noreferrer"
            >
              Read original source â†—
            </a>
          </div>
        `
        : ""
      }

    `;

    reader.scrollTop = 0;

  } catch (error) {

    readerBody.innerHTML = `
      <div class="archive-loading">
        Unable to load this story.
      </div>
    `;

  }

}


/* ---------------------------------------------------------
   CLOSE READER
--------------------------------------------------------- */

function closeArticle() {

  reader.classList.remove("open");

  document.body.style.overflow = "";

}


closeReader.addEventListener("click", closeArticle);


document.addEventListener("keydown", event => {

  if (event.key === "Escape") {
    closeArticle();
  }

});


/* ---------------------------------------------------------
   SEARCH, FILTER + PAGINATION
--------------------------------------------------------- */

let archiveCurrentPage = 1;
let archiveRequestNumber = 0;
let archiveTotalPages = 1;

const archivePager = document.createElement("div");
archivePager.id = "archivePager";
archivePager.style.cssText =
  "display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;padding:22px 10px;";

root.insertAdjacentElement("afterend", archivePager);

function drawArchivePager() {
  archivePager.replaceChildren();

  function makeButton(label, disabled, action) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = label;
    button.disabled = disabled;
    button.style.cssText =
      "padding:10px 16px;border:1px solid #65e1ff;background:#171b20;color:#65e1ff;cursor:pointer;border-radius:4px;";

    if (disabled) {
      button.style.opacity = "0.45";
      button.style.cursor = "not-allowed";
    }

    button.addEventListener("click", action);
    return button;
  }

  archivePager.appendChild(
    makeButton("Previous", archiveCurrentPage <= 1, () => {
      if (archiveCurrentPage > 1) loadArchive(archiveCurrentPage - 1);
    })
  );

  const pageLabel = document.createElement("span");
  pageLabel.textContent =
    "Page " + archiveCurrentPage + " of " + archiveTotalPages;
  pageLabel.style.cssText = "color:inherit;font-size:14px;";
  archivePager.appendChild(pageLabel);

  archivePager.appendChild(
    makeButton("Next", archiveCurrentPage >= archiveTotalPages, () => {
      if (archiveCurrentPage < archiveTotalPages) {
        loadArchive(archiveCurrentPage + 1);
      }
    })
  );
}

async function loadArchive(page = 1) {
  const thisRequest = ++archiveRequestNumber;
  archiveCurrentPage = Math.max(1, page);

  root.innerHTML =
    '<div class="archive-loading">Loading archive...</div>';
  count.textContent = "Loading...";

  try {
    const params = new URLSearchParams({
      page: String(archiveCurrentPage),
      per_page: "25",
      q: search.value.trim(),
      category: category.value
    });

    const response = await fetch("/archive.json?" + params.toString());

    if (!response.ok) {
      throw new Error("Archive request failed: HTTP " + response.status);
    }

    const payload = await response.json();

    if (thisRequest !== archiveRequestNumber) return;

    if (!payload || !Array.isArray(payload.articles)) {
      throw new Error("The archive API returned an unexpected response.");
    }

    const previousCategory = category.value;
    const categories = Array.isArray(payload.categories)
      ? payload.categories
      : [];

    category.replaceChildren();

    const allOption = document.createElement("option");
    allOption.value = "all";
    allOption.textContent = "All signals";
    category.appendChild(allOption);

    categories.forEach(cat => {
      const option = document.createElement("option");
      option.value = cat;
      option.textContent = cat.toUpperCase();
      category.appendChild(option);
    });

    category.value =
      [...category.options].some(option => option.value === previousCategory)
        ? previousCategory
        : "all";

    all = payload.articles;
    archiveCurrentPage = payload.page || 1;
    archiveTotalPages = payload.total_pages || 1;

    renderList(all);

    count.textContent =
      (payload.total || 0) + " stories ? Page " +
      archiveCurrentPage + " of " + archiveTotalPages;

    drawArchivePager();

    if (!all.length) {
      root.innerHTML =
        '<div class="archive-empty">No stories match your search.</div>';
    }

  } catch (error) {
    if (thisRequest !== archiveRequestNumber) return;

    console.error("Archive loading failed:", error);

    root.innerHTML =
      '<div class="archive-empty">Archive unavailable. Please try again.</div>';

    count.textContent = "ERROR";
    archivePager.replaceChildren();

    const retry = document.createElement("button");
    retry.type = "button";
    retry.textContent = "Retry";
    retry.style.cssText =
      "padding:10px 16px;border:1px solid #65e1ff;background:#171b20;color:#65e1ff;cursor:pointer;";
    retry.addEventListener("click", () => loadArchive(archiveCurrentPage));
    archivePager.appendChild(retry);
  }
}

search.addEventListener("input", () => loadArchive(1));
category.addEventListener("change", () => loadArchive(1));

loadArchive();


</script>

</body>
</html>
